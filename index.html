<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sync Cue Engine</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="brand">
      <span class="brand-icon">⬡</span>
      <div>
        <h1>SYNC CUE ENGINE</h1>
        <p class="brand-sub">Audio engineering &middot; Timecode synchronization &middot; Web Audio API precision</p>
      </div>
    </div>
    <div class="clock-display">
      <span id="transport-clock">00:00.000</span>
      <span id="transport-label">STOPPED</span>
    </div>
  </header>

  <div class="layout">

    <!-- Left panel -->
    <div class="left-panel">

      <section class="card">
        <div class="card-title">Audio Track</div>
        <label class="file-btn">
          Load file &nbsp;(mp3 / wav)
          <input type="file" id="audio-input" accept=".mp3,.wav,.ogg">
        </label>
        <div id="audio-name" class="file-name">No file loaded</div>
        <div id="audio-dur" class="file-dur"></div>
      </section>

      <section class="card cue-card">
        <div class="card-header">
          <div class="card-title">Cue Sheet</div>
          <button class="btn-small" id="add-cue-btn">+ Add</button>
        </div>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>Time (mm:ss.ms)</th>
                <th>Label</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="cue-list"></tbody>
          </table>
        </div>
      </section>

      <section class="card">
        <div class="transport-row">
          <button id="play-btn" class="btn-play" disabled>&#9654; &nbsp;PLAY</button>
          <button id="stop-btn" class="btn-stop" disabled>&#9632; &nbsp;STOP</button>
        </div>
        <div id="cue-log"></div>
      </section>

    </div>

    <!-- Right panel: Signal Monitor -->
    <div class="right-panel">
      <div class="card monitor-card">
        <div class="card-header">
          <div class="card-title">Signal Monitor</div>
          <span id="monitor-status" class="monitor-status">STANDBY</span>
        </div>
        <div class="indicator-wrap">
          <div id="cue-indicator">
            <div class="ind-cue-row">
              <span class="ind-cue-prefix">&#9658;</span>
              <span id="ind-cue-label">&#8212;</span>
            </div>
            <div class="ind-dev-row">
              <span class="ind-dev-label">DEVIATION</span>
              <span id="ind-dev-value">&#8212;</span>
              <span class="ind-dev-unit">ms</span>
            </div>
          </div>
          <p class="monitor-note">Trigger method: Tone.Transport &mdash; Web Audio API internal clock (not setInterval)</p>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/tone@14/build/Tone.js"></script>
  <script src="app.js"></script>
</body>
</html>
